<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Painterly House -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5b0"/>
      <stop offset="100%" stop-color="#c4a67a"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b3a3a"/>
      <stop offset="100%" stop-color="#6b2222"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="98" cy="172" rx="52" ry="10" fill="rgba(0,0,0,0.18)"/>
  <!-- Walls -->
  <rect x="52" y="90" width="88" height="78" rx="3" fill="url(#wall)" stroke="#6b4f30" stroke-width="2"/>
  <!-- Roof -->
  <polygon points="40,94 96,42 152,94" fill="url(#roof)" stroke="#4a1a1a" stroke-width="2"/>
  <!-- Door -->
  <rect x="82" y="128" width="28" height="40" rx="2" fill="#5a3a1a" stroke="#3a2210" stroke-width="1.5"/>
  <circle cx="104" cy="150" r="2.5" fill="#d8b25a"/>
  <!-- Window -->
  <rect x="62" y="104" width="18" height="18" rx="2" fill="#a8d8ea" stroke="#5a3a1a" stroke-width="1.5"/>
  <line x1="71" y1="104" x2="71" y2="122" stroke="#5a3a1a" stroke-width="1"/>
  <line x1="62" y1="113" x2="80" y2="113" stroke="#5a3a1a" stroke-width="1"/>
  <!-- Chimney -->
  <rect x="118" y="52" width="14" height="30" fill="#8a6a4a" stroke="#5a3a1a" stroke-width="1.5"/>
  <!-- Smoke wisps -->
  <path d="M125,48 Q128,38 122,30" fill="none" stroke="rgba(180,180,180,0.5)" stroke-width="2"/>
  <path d="M125,42 Q130,32 126,22" fill="none" stroke="rgba(180,180,180,0.35)" stroke-width="1.5"/>
</svg>
