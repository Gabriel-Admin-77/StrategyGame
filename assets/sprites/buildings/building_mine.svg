<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Painterly Mine -->
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7358"/>
      <stop offset="100%" stop-color="#5a4a38"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="96" cy="176" rx="50" ry="10" fill="rgba(0,0,0,0.18)"/>
  <!-- Mountain rock face -->
  <polygon points="30,170 96,50 162,170" fill="url(#rock)" stroke="#3a2a1a" stroke-width="2"/>
  <!-- Mine entrance arch -->
  <path d="M68,170 L68,120 Q96,96 124,120 L124,170 Z" fill="#2a1a0a"/>
  <path d="M68,120 Q96,96 124,120" fill="none" stroke="#6b4f30" stroke-width="3"/>
  <!-- Support beams -->
  <rect x="66" y="115" width="6" height="58" fill="#6b4f30" stroke="#4a3018" stroke-width="1"/>
  <rect x="120" y="115" width="6" height="58" fill="#6b4f30" stroke="#4a3018" stroke-width="1"/>
  <rect x="66" y="113" width="60" height="6" fill="#6b4f30" stroke="#4a3018" stroke-width="1"/>
  <!-- Cart track rails -->
  <line x1="78" y1="170" x2="78" y2="155" stroke="#555" stroke-width="2"/>
  <line x1="114" y1="170" x2="114" y2="155" stroke="#555" stroke-width="2"/>
  <!-- Ore cart -->
  <rect x="80" y="148" width="32" height="18" rx="2" fill="#6a5a4a" stroke="#3a2a1a" stroke-width="1.5"/>
  <circle cx="84" cy="168" r="4" fill="#444" stroke="#222" stroke-width="1"/>
  <circle cx="108" cy="168" r="4" fill="#444" stroke="#222" stroke-width="1"/>
  <!-- Gold ore sparkles -->
  <circle cx="88" cy="152" r="3" fill="#d8b25a"/>
  <circle cx="98" cy="150" r="2.5" fill="#e8c86a"/>
  <circle cx="105" cy="154" r="2" fill="#d8b25a"/>
</svg>
