<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Painterly Market -->
  <defs>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c94040"/>
      <stop offset="33%" stop-color="#e8e0c8"/>
      <stop offset="66%" stop-color="#c94040"/>
      <stop offset="100%" stop-color="#e8e0c8"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a4a"/>
      <stop offset="100%" stop-color="#5a3a1a"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="96" cy="174" rx="58" ry="10" fill="rgba(0,0,0,0.18)"/>
  <!-- Counter / table -->
  <rect x="38" y="120" width="116" height="48" rx="3" fill="url(#wood)" stroke="#3a2210" stroke-width="2"/>
  <!-- Goods on counter -->
  <circle cx="62" cy="118" r="8" fill="#d8b25a" stroke="#a08030" stroke-width="1"/>
  <circle cx="82" cy="116" r="7" fill="#e08040" stroke="#a06020" stroke-width="1"/>
  <circle cx="100" cy="118" r="8" fill="#6aaa4a" stroke="#3a7a2a" stroke-width="1"/>
  <circle cx="120" cy="116" r="7" fill="#a06aba" stroke="#704a8a" stroke-width="1"/>
  <!-- Canopy supports -->
  <rect x="42" y="62" width="6" height="62" fill="#5a3a1a"/>
  <rect x="144" y="62" width="6" height="62" fill="#5a3a1a"/>
  <!-- Striped canopy -->
  <path d="M32,68 Q96,42 160,68 L154,80 Q96,56 38,80 Z" fill="url(#canopy)" stroke="#8a2020" stroke-width="1.5"/>
  <!-- Sign -->
  <rect x="72" y="78" width="48" height="20" rx="3" fill="#e8d5b0" stroke="#6b4f30" stroke-width="1"/>
  <text x="96" y="93" text-anchor="middle" font-size="12" fill="#4a3524" font-family="serif">MARKET</text>
</svg>
